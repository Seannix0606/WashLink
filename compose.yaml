# Local development. `docker compose up -d --build` starts only the website, at http://localhost:5173, with live
# reload: it serves this folder's frontend/ and packages/, so saving a file updates the page. It talks to the Supabase
# named in frontend/.env.local (gitignored); use the local test stack there, never the live project.
#
# The old Python backend and Redis are no longer used by the website (it talks to Supabase directly). They only start
# with the "legacy-backend" profile: docker compose --profile legacy-backend up -d
services:
  backend:
    profiles: ["legacy-backend"]
    build:
      context: ./backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/washlink.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
    volumes:
      - ./backend:/app
      - washlink_backend_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    profiles: ["legacy-backend"]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      # The repository root, so the image includes packages/shared as well as frontend.
      context: .
      dockerfile: frontend/Dockerfile
    # Comes back whenever Docker Desktop starts, until stopped with `docker compose stop`.
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Supabase address, key and feature flags come from frontend/.env.local, read by Vite. Setting them here, even
      # empty, would override that file.
      # Files changed on Windows don't send change events into the container, so Vite checks for changes instead.
      WASHLINK_DEV_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app/frontend
      - ./packages:/app/packages
      - washlink_frontend_node_modules:/app/frontend/node_modules

volumes:
  washlink_backend_data:
  washlink_frontend_node_modules:
