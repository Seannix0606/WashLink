<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F766E" />
    <title>WashLink is offline</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f4f7f6; color: #10201d;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.4rem; margin: 20px 0 8px; }
      p { margin: 0 0 20px; color: #4a5b58; max-width: 22rem; line-height: 1.5; }
      a.button { display: inline-block; font-weight: 600; color: #fff; background: #0F766E; border-radius: 999px; padding: 12px 22px;
        text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>WashLink needs a connection to show your bookings. Check your signal and try again.</p>
      <!-- A link, not a script: the site's Content-Security-Policy blocks inline scripts. -->
      <a class="button" href="/">Try again</a>
    </main>
  </body>
</html>
